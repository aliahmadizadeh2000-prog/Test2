name: build-exe

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install opencv-python-headless numpy mss Pillow pyinstaller
      - run: pyinstaller --onefile --windowed --name SaleBot clicker.py
      - uses: actions/upload-artifact@v4
        with:
          name: SaleBot-windows
          path: dist/SaleBot.exe
