name: Build AutoClicker

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless mss pillow pyinstaller

      - name: Show files
        run: dir

      - name: Check
        run: python -m py_compile autoclicker.py engine.py digits.py profiles.py assets.py

      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --name AutoClicker autoclicker.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-windows
          path: dist/AutoClicker.exe
